# Local stack: `pnpm db:up`, then `pnpm db:migrate`. Development only; ports bind to loopback.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel # local-only throwaway; never reuse
      POSTGRES_DB: kestrel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 2s
      timeout: 3s
      retries: 20

  # SQS-compatible queue for the verification worker (later phases). Endpoint http://127.0.0.1:9324.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "127.0.0.1:9324:9324"
      - "127.0.0.1:9325:9325"

volumes:
  pgdata:
