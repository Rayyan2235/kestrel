name: Deploy Kestrel
# After "Check Kestrel" passes on main: deploy the CDK stack, then gate it.
# The gate is /api/health plus the L2 Playwright spec against CloudFront. If
# either fails, the API's `live` alias goes back to the version it had before.
#
# Inert until the owner sets the repo variable AWS_DEPLOY_ROLE_ARN (see
# infra/README.md). No AWS key is stored in GitHub: the job trades its OIDC
# token for the role from infra/kestrel_infra/github_oidc.py.
on:
  workflow_run:
    workflows: [Check Kestrel]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
# One deploy at a time; a newer one waits instead of cancelling a rollback.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The role trusts only this environment; its settings allow only main.
    environment: production
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit that passed CI, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r infra/requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # apps/web/dist and apps/api/dist-lambda, both read by infra/app.py.
      - run: pnpm build
      - name: Record the live version
        id: before
        run: |
          # Empty on the first deploy, when there is nothing to roll back to.
          v=$(aws lambda get-alias --function-name kestrel-api --name live --query FunctionVersion --output text 2>/dev/null || true)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The verifier image is arm64 (verifier/Dockerfile); the runner is x86.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: cdk deploy
        working-directory: infra
        env:
          # Read by infra/app.py: where alarms are emailed, and the credits the budget tracks.
          KESTREL_ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          KESTREL_CREDITS_USD: ${{ vars.AWS_CREDITS_USD }}
        run: npx --yes aws-cdk@2.1145.0 deploy Kestrel --require-approval never --outputs-file cdk-outputs.json
      - name: Read outputs
        id: out
        run: echo "site=$(jq -r '.Kestrel.SiteUrl' infra/cdk-outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Gate, /api/health
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 20 "${{ steps.out.outputs.site }}/api/health" | tee health.json && break
            sleep 10
          done
          jq -e '.name == "Kestrel"' health.json
      - name: Gate, L2 spec against CloudFront
        # The spec fulfils the agent turn and aborts every other /api call, so
        # it makes no Bedrock or ElevenLabs call.
        run: pnpm exec playwright test tests/beam-xp-levels.spec.ts --project=desktop --workers=1
        env:
          KESTREL_BASE_URL: ${{ steps.out.outputs.site }}
      - name: Roll back the API alias
        if: failure() && steps.before.outputs.version != ''
        run: |
          aws lambda update-alias --function-name kestrel-api --name live \
            --function-version "${{ steps.before.outputs.version }}"
          echo "::error::Deploy gate failed; live alias moved back to version ${{ steps.before.outputs.version }}."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-gate-results
          path: |
            test-results/
            playwright-report/
