name: Check Kestrel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A throwaway Postgres for the migration up/down/up test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: kestrel
          POSTGRES_DB: kestrel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kestrel -d kestrel_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      KESTREL_TEST_DATABASE_URL: postgres://kestrel:kestrel@127.0.0.1:5432/kestrel_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # CDK infra policy checks: in-process synth, no AWS credentials.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r infra/requirements.txt
      - run: python -m pytest -q infra/tests
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
