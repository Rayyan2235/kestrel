</style></head><body><header><h1>Pip & Nova · Selected colors</h1><p>Same robot geometry, pose and lighting. Pip on the left · Nova on the right.</p></header><main class="grid"></main><footer>Live rig materials · actual Microduck models · simplified playground-colored setting</footer><script type="module">

 scene.add(new THREE.HemisphereLight('#e9f6ff','#a5b88a',2.2));const sun=new THREE.DirectionalLight('#fff1d6',3);sun.position.set(-1,2,1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-2;sun.shadow.camera.right=2;sun.shadow.camera.top=2;sun.shadow.camera.bottom=-2;sun.shadow.bias=-.0001;scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:'#8ead69',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
